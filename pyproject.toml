[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simweb-core"
version = "0.1.0"
description = "Shared web shell, viewer, LLM link and geometry IO for the LLM-web simulators (FEM, SPH, LBM)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["simweb*"]

[tool.setuptools.package-data]
simweb = ["web/*.css", "web/js/*.js", "web/vendor/*"]
